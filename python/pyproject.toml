[project]
name = "lazurio-module-kit"
version = "0.1.0"
description = "Lazurio Module Standard runtime helpers: listener, health"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/Lazurio/module-kit"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.12", "pyright>=1.1.400"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
